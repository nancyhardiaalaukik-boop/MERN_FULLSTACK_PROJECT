<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager | Login</title><link rel="stylesheet" href="Login.css">
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">        <h1><i class="fa-solid fa-graduation-cap"></i>Student Login</h1>
        <p>Login to manage your tasks and stay organised.</p>
        <form action="#" method="post">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-box">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>
            <div class="form-group">
    <label for="password">Password</label>
    <div class="input-box">
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >
        <i class="fa-solid fa-eye toggle-password"
           id="togglePassword"></i>
    </div>
</div>
            <button type="submit">Login</button>
        </form>
        <p class="register-link">
            Don't have an account?
            <a href="Register.html">Register here</a>
        </p>
    </section>
</main>
<script>
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    togglePassword.addEventListener("click", function () {
        if (password.type === "password") {
            password.type = "text";
            togglePassword.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            password.type = "password";
            togglePassword.classList.replace("fa-eye-slash", "fa-eye");
        }
    });
</script>
</body>
</html>
