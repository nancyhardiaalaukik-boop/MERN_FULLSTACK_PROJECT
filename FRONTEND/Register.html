<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager | Register</title>
    <link rel="stylesheet" href="Register.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <main class="register-container">
        <section class="register-card">
            <header class="register-header">
                <div class="logo">
                    <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                </div>
                <p class="eyebrow">YOUR ACADEMIC WORKSPACE</p>
                <h1>Create your account</h1>
                <p class="description">
                    Your journey to better organisation starts here.
                    Manage and stay on top of your academic goals.
                </p>
            </header>
            <form action="#" method="post">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <div class="input-box">
                        <input type="text" id="full-name" name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name" required>
                        <i class="fa-regular fa-user" aria-hidden="true"></i>
                    </div>
                    <small class="error-message" id="name-error"
                        aria-live="polite"></small>
                </div>
                <!-- Email Address -->
<div class="form-group">
    <label for="email">Email Address</label>
    <div class="input-box">
        <input type="email" id="email" name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            oninvalid="this.setCustomValidity(this.validity.valueMissing ? 'Please enter your email address.' : 'Please enter a valid email address.')"
            oninput="this.setCustomValidity('')"
            required>
        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
    </div>
    <small class="error-message" id="email-error"
        aria-live="polite"></small>
</div>
<!-- Date of Birth -->
<div class="form-group">
    <label for="date-of-birth">Date of Birth</label>
    <input type="date" id="date-of-birth"
        name="dateOfBirth" autocomplete="bday">
</div>
                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-box">
                        <input type="password" id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8" required>
                        <button type="button" class="toggle-password"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password">
                            <i class="fa-solid fa-eye"
                                aria-hidden="true"></i>
                        </button>
                    </div>
                    <small class="error-message" id="password-error"
                        aria-live="polite"></small>
                </div>
                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-box">
                        <input type="password" id="confirm-password"
                            name="confirmPassword"
                            placeholder="Enter your password again"
                            autocomplete="new-password" required>
                        <button type="button" class="toggle-password"
                            onclick="togglePassword('confirm-password', this)"
                            aria-label="Show confirm password">
                            <i class="fa-solid fa-eye"
                                aria-hidden="true"></i>
                        </button>
                    </div>
                    <small class="error-message" id="confirm-password-error"
                        aria-live="polite"></small>
                </div>
                <!-- Submit Button -->
                <button type="submit" class="submit-button">
                    Create Account
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>
            <p class="login-link">
                Already have an account?
                <a href="Login.html">Login here</a>
            </p>
        </section>
        <p class="page-note">
            Plan better. Stay organised. Achieve more.
        </p>
    </main>
    <script>
        function togglePassword(id, button) {
            const password = document.getElementById(id);
            const icon = button.querySelector("i");
            if (password.type === "password") {
                password.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
                button.setAttribute("aria-label", "Hide password");
            } else {
                password.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
                button.setAttribute("aria-label", "Show password");
            }
        }
    </script>
</body>
</html>
